# One Kafka node in Kraft mode: boker and controller in the same process
process.roles=broker,controller  
# single node cluster
node.id=1 
# every node in the cluster must have a unique id
# 9093 is the default port for the controller listener
controller.quorum.bootstrap.servers=localhost:9093
# clients connect to the broker listener, which is on port 9092
# PLAINTEXT is the default listener protocol with no encryption, but you can also use SSL or SASL_SSL
listeners=PLAINTEXT://:9092,CONTROLLER://:9093
# address that clients will use to connect to the broker listener, which is on port 9092
advertised.listeners=PLAINTEXT://localhost:9092
# controller.listener.names is used to specify the listener name for the controller, which is CONTROLLER in this case
controller.listener.names=CONTROLLER
# log directories for the Kafka broker
log.dirs=kafka-data
# number of partitions for the Kafka broker
num.partitions=3
# replication factor for the offsets topic
offsets.topic.replication.factor=1
# replication factor for the transaction state log
transaction.state.log.replication.factor=1
# minimum in-sync replicas for the transaction state log
transaction.state.log.min.isr=1
# initial delay for group rebalancing
group.initial.rebalance.delay.ms=0
# kafka broker will not automatically create topics when a producer or consumer tries to access a non-existent topic
auto.create.topics.enable=false